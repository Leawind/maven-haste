[storage]
root = './repository'

# Repository order is significant. Loader-specific repositories are only consulted for their own namespaces.
[[repositories]]
id = 'fabric'
url = 'https://maven.fabricmc.net/'
rules = ['net/fabricmc/**', 'fabric-loom/**', '!**']

[[repositories]]
id = 'minecraft-forge'
url = 'https://maven.minecraftforge.net/'
rules = ['net/minecraftforge/**', 'net/minecraft/**', 'de/oceanlabs/mcp/**', '!**']

[[repositories]]
id = 'neoforge'
url = 'https://maven.neoforged.net/releases/'
rules = ['net/neoforged/**', '!**']

[[repositories]]
id = 'parchment'
url = 'https://maven.parchmentmc.org/'
rules = ['org/parchmentmc/**', '!**']

[[repositories]]
id = 'terraformersmc'
url = 'https://maven.terraformersmc.com/releases/'
rules = ['com/terraformersmc/**', '!**']

[[repositories]]
id = 'sponge'
url = 'https://repo.spongepowered.org/repository/maven-public/'
rules = ['org/spongepowered/**', '!**']

[[repositories]]
id = 'maven-central'
url = 'https://repo1.maven.org/maven2/'

# Plugin marker coordinates do not share one namespace, so this repository remains a final fallback.
[[repositories]]
id = 'gradle-plugin-portal'
url = 'https://plugins.gradle.org/m2/'
