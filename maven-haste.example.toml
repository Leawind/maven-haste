# maven-haste reads configuration from maven-haste.json, maven-haste.toml, or
# maven-haste.yaml, chosen by the file extension. This template is TOML; the
# same keys work in the other formats.

# # Schema hint: the URL below is pinned to the current release version and
# # works from anywhere with a network connection. `config init` replaces
# # ${VERSION} with the actual version automatically; when copying this file
# # manually, substitute the version printed by `maven-haste --version`.
"$schema" = 'https://raw.githubusercontent.com/Leawind/maven-haste/v${VERSION}/maven-haste.schema.json'

# # Offline alternative: create a local copy next to this config once with
# # `maven-haste config schema -o ./maven-haste.schema.json`, then uncomment:
# "$schema" = './maven-haste.schema.json'

# # Optional server settings. Omit this table to use 127.0.0.1:8080 and /maven.
# [server]
# # Address on which Maven Haste accepts HTTP requests.
# bind = '127.0.0.1:8080'
# # URL prefix for the local Maven repository endpoint.
# # The root path and /api namespace are reserved for Maven Haste itself.
# base_path = '/maven'

[storage]
# Required directory used for cached artifacts, temporary downloads, and the SQLite database.
# Relative paths are resolved relative to this configuration file.
root = './repository'
# # Optional directory for temporary downloads. Defaults to <root>/.maven-haste/tmp.
# tmp_dir = './repository/.maven-haste/tmp'
# # Optional SQLite database path. Defaults to <root>/.maven-haste/cache.db.
# db_path = './repository/.maven-haste/cache.db'

# # Optional cache settings. Omit this table to use the defaults below.
# [cache]
# # Optional maximum number of cached artifact bytes. Omit to retain cached files indefinitely.
# max_size = 10737418240
# # How long mutable metadata may be served before a background refresh starts.
# metadata_ttl = '5m'
# # How long a confirmed 404 is remembered for one path in one upstream repository.
# negative_ttl = '5m'
# # Serve the last cached mutable file when refreshing it encounters an upstream failure.
# serve_stale_on_error = true

# # Optional JSON Lines file logging settings.
# [logging]
# # Write JSON Lines logs to daily files. Defaults to `false`
# enabled = false
# # Directory for daily JSON Lines log files. Defaults to <root>/.maven-haste/logs.
# directory = './repository/.maven-haste/logs'
# # Retention period for completed daily log files.
# retention = '30d'
# # Rust EnvFilter expression for file output. Reference:
# # https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives
# filter = 'maven_haste=info,maven_haste::access=debug'

# # Optional upstream settings. Omit this table to use the defaults below.
# [upstream]
# # Optional global upstream proxy.
# # proxy = 'http://127.0.0.1:7890'
# # Maximum time allowed to establish a connection to an upstream repository.
# connect_timeout = '10s'
# # Maximum idle time while reading each upstream response body.
# # This is not a limit on the total download time of a large file.
# read_timeout = '60s'
# # Maximum number of simultaneous requests across all upstream repositories.
# max_concurrency = 32
# # Per-repository concurrency limit when a repository does not override it.
# default_repository_max_concurrency = 10
# # Admit one queued cache refresh after this many foreground downloads while both are waiting.
# foreground_priority_burst = 8

# # Optional circuit-breaker settings. Omit this table to use the defaults below.
# [circuit_breaker]
# # Consecutive upstream failures required before temporarily skipping that repository.
# failure_threshold = 3
# # Time to wait before probing an upstream repository after its circuit opens.
# recovery_timeout = '30s'

# # At least one upstream repository is required.
# [[repositories]]
# Required unique repository id used for routing, circuit breaking, logging, and statistics.
# Use only lowercase letters, digits, underscores, and hyphens.
# id = 'gradle-plugin'
# url = 'https://plugins.gradle.org/m2/'
# # Optional per-repository proxy switch.
# # true: use [upstream].proxy
# # false: connect directly without using [upstream].proxy
# # omitted: use [upstream].proxy when it is configured, otherwise connect directly
# # use_proxy = true
# # Optional per-repository override of default_repository_max_concurrency.
# max_concurrency = 10
# # Optional per-repository cache switch; defaults to true.
# # false stops writing new artifacts, checksums, and negative entries from this repository:
# # previously cached content is still served and nothing is deleted.
# cache_writes = true
# # Optional ordered request-path glob rules. The first matching rule decides participation.
# # Prefix a rule with ! to exclude it; * matches within one path segment and ** may match across path separators.
# rules = ['gradle/plugin/**', '!**']

[[repositories]]
id = 'central'
url = 'https://repo1.maven.org/maven2/'
# # Optional per-repository cache switch; defaults to true.
# # false stops writing new artifacts, checksums, and negative entries from this repository:
# # previously cached content is still served and nothing is deleted.
# cache_writes = true
# # Optional per-repository proxy switch.
# # true: use [upstream].proxy
# # false: connect directly without using [upstream].proxy
# # omitted: use [upstream].proxy when it is configured, otherwise connect directly
# # use_proxy = true
