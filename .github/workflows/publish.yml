name: Publish

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings
            - run: cargo test
            - run: deno fmt --check

    build-binaries:
        name: Build ${{ matrix.name }} binary
        needs: verify
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      archive: maven-haste-x86_64-unknown-linux-gnu.tar.gz
                      binary: maven-haste
                    - name: x86_64-apple-darwin
                      os: macos-latest
                      archive: maven-haste-x86_64-apple-darwin.tar.gz
                      binary: maven-haste
                    - name: x86_64-pc-windows-msvc
                      os: windows-latest
                      archive: maven-haste-x86_64-pc-windows-msvc.zip
                      binary: maven-haste.exe

        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - run: cargo build --release

            - name: Package Unix binary
              if: runner.os != 'Windows'
              run: tar -C target/release -czf ${{ matrix.archive }} ${{ matrix.binary }}

            - name: Package Windows binary
              if: runner.os == 'Windows'
              shell: pwsh
              run: Compress-Archive -Path target/release/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: ${{ matrix.archive }}
                  if-no-files-found: error

    draft-release:
        name: Create GitHub release draft
        needs: build-binaries
        runs-on: ubuntu-latest
        permissions:
            contents: write

        outputs:
            version: ${{ steps.resolve.outputs.version }}

        steps:
            - uses: actions/checkout@v4

            - name: Resolve version from Cargo.toml
              id: resolve
              run: |
                  version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
                  test -n "$version"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Extract release notes
              env:
                  VERSION: ${{ steps.resolve.outputs.version }}
              run: |
                  awk -v version="$VERSION" '
                      index($0, "## [" version "]") == 1 { in_section = 1; next }
                      in_section && /^## / { exit }
                      in_section { print }
                  ' CHANGELOG.md > RELEASE_NOTES.md
                  test -s RELEASE_NOTES.md

            - name: Push release tag
              env:
                  TAG: v${{ steps.resolve.outputs.version }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  expected="$(git rev-parse HEAD)"
                  remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
                  if [ -n "$remote_tag" ]; then
                      git fetch --no-tags origin "refs/tags/$TAG"
                      actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
                      if [ "$actual" != "$expected" ]; then
                          echo "::error::Release tag $TAG already points to a different commit."
                          exit 1
                      fi
                      echo "Reusing release tag $TAG at the current commit."
                  else
                      git tag "$TAG" "$expected"
                      git push origin "$TAG"
                  fi

            - uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.resolve.outputs.version }}
                  draft: true
                  body_path: RELEASE_NOTES.md
                  files: release-assets/*

    publish-crate:
        name: Publish crate to crates.io
        needs: draft-release
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    publish-image:
        name: Publish container image to ghcr.io
        needs: draft-release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Lowercase the repository name
              id: repo
              run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ steps.repo.outputs.repository }}:${{ needs.draft-release.outputs.version }}
                      ghcr.io/${{ steps.repo.outputs.repository }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    publish-release:
        name: Publish GitHub release
        needs: [draft-release, publish-crate, publish-image]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Publish release draft
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: v${{ needs.draft-release.outputs.version }}
              run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
