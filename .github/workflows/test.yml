name: Test

on:
    # Keep runs manual to control GitHub Actions resource usage.
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings
            - run: cargo test
            - run: deno fmt --check
