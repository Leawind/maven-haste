[package]
name = "maven-haste"
version = "0.1.0"
edition = "2024"
description = "A lightweight local Maven repository proxy cache"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
deadpool-sqlite = { version = "0.12", features = ["bundled"] }
directories = "6.0"
dunce = "1.0"
humantime-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
