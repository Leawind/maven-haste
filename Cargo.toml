[package]
name = "maven-haste"
version = "0.1.0"
edition = "2024"
description = "A lightweight, self-hosted local Maven repository proxy cache."
license = "MIT"
repository = "https://github.com/Leawind/maven-haste"
readme = "README.md"
keywords = ["maven", "proxy", "cache", "repository"]
categories = ["caching", "command-line-utilities"]
exclude = ["config-examples/**", "frontend/**", "test-projects/**"]

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6.1"
deadpool-sqlite = { version = "0.12", features = ["bundled"] }
directories = "6.0"
dunce = "1.0"
futures-util = "0.3"
http-body = "1.0"
humantime-serde = "1.1"
mime_guess = "2.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
pin-project-lite = "0.2"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
